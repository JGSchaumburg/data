[gitsheet]
root = 'datasets/pennsylvania/legislature-leadership-2027-28/records'
path = '${{ chamber }}/${{ post_id }}'

[gitsheet.schema]
type = 'object'
required = ['chamber', 'post_id', 'caucus', 'role', 'status', 'source', 'source_date', 'match_status', 'as_of']
additionalProperties = false

[gitsheet.schema.properties.chamber]
enum = ['house', 'senate']

[gitsheet.schema.properties.post_id]
type = 'string'
pattern = '^[a-z0-9-]+$'

[gitsheet.schema.properties.caucus]
type = 'string'
minLength = 1

[gitsheet.schema.properties.role]
type = 'string'
minLength = 1

[gitsheet.schema.properties.holder]
type = 'string'
minLength = 1

[gitsheet.schema.properties.district]
type = 'string'
pattern = '^[0-9]{1,3}$'

[gitsheet.schema.properties.status]
enum = ['Announced', 'Expected', 'Contested', 'Not announced']

[gitsheet.schema.properties.source]
type = 'string'
minLength = 1

[gitsheet.schema.properties.source_date]
type = 'string'
pattern = '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

[gitsheet.schema.properties.match_status]
enum = ['not_on_2026_ballot', 'party_mismatch', 'no_holder', 'not_in_roster', 'ambiguous_roster', 'race_uncounted', 'name_district_mismatch']

[gitsheet.schema.properties.match_note]
type = 'string'

[gitsheet.schema.properties.note]
type = 'string'

[gitsheet.schema.properties.as_of]
type = 'string'
pattern = '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
